name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group release
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check --strict dist/*
      - name: Check release version and smoke test installed wheel
        run: |
          python -m pip install dist/*.whl
          cd "${RUNNER_TEMP}"
          package_version="$(python -c 'from importlib.metadata import version; print(version("vit"))')"
          if [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version v${package_version}"
            exit 1
          fi
          echo "Validated release tag ${GITHUB_REF_NAME}"
          vit --help
          vit --version
      - name: Store distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: [test, build]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/vit
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
